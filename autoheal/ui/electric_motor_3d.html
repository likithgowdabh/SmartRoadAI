<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Electric Motor 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0c1220; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: sans-serif; }
  #wrap { width: 100%; max-width: 900px; }
  canvas { display: block; width: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hint { text-align: center; padding: 6px; background: #0f172a; color: #475569; font-size: 11px; }
  #ui {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    padding: 10px 12px; background: #0f172a; flex-wrap: wrap;
  }
  #ui button {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #cbd5e1; border-radius: 20px; padding: 6px 16px; cursor: pointer;
    font-size: 13px; transition: background 0.15s;
  }
  #ui button:hover { background: rgba(255,255,255,0.18); }
  #ui button.on { background: #2563eb; border-color: #3b82f6; color: #fff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hint">Drag to rotate &nbsp;|&nbsp; Scroll to zoom</div>
  <div id="ui">
    <button id="b-explode" class="on" onclick="setMode('explode')">Exploded</button>
    <button id="b-assemble" onclick="setMode('assemble')">Assembled</button>
    <button id="b-spin" onclick="setMode('spin')">Spinning</button>
    <button id="b-xray" onclick="setMode('xray')">X-Ray</button>
    <button id="b-auto" class="on" onclick="autoRot=!autoRot;this.classList.toggle('on')">Auto-rotate</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const cv = document.getElementById('c');
const wrap = document.getElementById('wrap');

function resize() {
  const pw = wrap.clientWidth;
  const ph = Math.round(pw * 0.62);
  cv.width = pw; cv.height = ph;
  renderer.setSize(pw, ph);
  camera.aspect = pw / ph;
  camera.updateProjectionMatrix();
}

const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x0c1220);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0c1220, 0.038);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 0, 12);
camera.lookAt(0, 0, 0);

// Lights
scene.add(new THREE.AmbientLight(0x7799cc, 0.65));
const dl = new THREE.DirectionalLight(0xffffff, 1.2);
dl.position.set(6, 10, 8); dl.castShadow = true; scene.add(dl);
const bl = new THREE.PointLight(0x3b82f6, 4, 18); bl.position.set(-5, 3, 3); scene.add(bl);
const al = new THREE.PointLight(0xf59e0b, 2.5, 12); al.position.set(4, -2, 5); scene.add(al);
const rl = new THREE.PointLight(0xff4444, 0, 8); rl.position.set(0, 0, 0); scene.add(rl);

function mmat(col, ro=0.3, me=0.8, em=0, emC=0) {
  return new THREE.MeshStandardMaterial({
    color: col, roughness: ro, metalness: me,
    emissive: emC || col, emissiveIntensity: em
  });
}
function cyl(rt, rb, h, s=32) { return new THREE.CylinderGeometry(rt, rb, h, s); }

const pivot = new THREE.Group();
scene.add(pivot);

const spinGroup = new THREE.Group();
pivot.add(spinGroup);

const parts = {};

function add(name, geo, mat, x, y, z, rx=0, ry=0, rz=0, grp=pivot) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true; m.receiveShadow = true;
  grp.add(m);
  parts[name] = { mesh: m, home: new THREE.Vector3(x, y, z), ex: new THREE.Vector3(x, y, z) };
  return m;
}

const BL=0x1d4ed8, ST=0x64748b, CU=0xb45309, SV=0x94a3b8,
      DK=0x1e293b, LB=0x2563eb, GD=0xd97706, BK=0x0f172a;
const L = 3.2;

// Motor frame
add('frame', cyl(1.06,1.06,L,48), mmat(BL,0.28,0.88), 0,0,0, 0,0,Math.PI/2);

// Cooling fins/ridges
for (let i=0; i<10; i++) {
  const rx = -L/2 + 0.18 + i*(L-0.12)/9;
  add('ridge'+i, cyl(1.12,1.12,0.07,48), mmat(LB,0.25,0.85), rx,0,0, 0,0,Math.PI/2);
}

// Stator laminations
add('statorLam', cyl(0.98,0.98,L-0.05,48), mmat(0x1e3a5f,0.55,0.55), 0,0,0, 0,0,Math.PI/2);

// Stator windings (copper coils)
for (let i=0; i<24; i++) {
  const a = (i/24)*Math.PI*2;
  const w = new THREE.Mesh(cyl(0.065,0.065,L-0.28,8), mmat(CU,0.5,0.35));
  w.rotation.set(0,0,Math.PI/2);
  w.position.set(0, Math.sin(a)*0.73, Math.cos(a)*0.73);
  pivot.add(w);
}

// Rotor
add('rotor',     cyl(0.50,0.50,L-0.08,32), mmat(0x374151,0.35,0.8), 0,0,0, 0,0,Math.PI/2, spinGroup);
add('rotorCore', cyl(0.35,0.35,L-0.12,16), mmat(CU,0.45,0.45),      0,0,0, 0,0,Math.PI/2, spinGroup);

// Rotor bars
for (let i=0; i<16; i++) {
  const a = (i/16)*Math.PI*2;
  const bar = new THREE.Mesh(cyl(0.03,0.03,L-0.15,6), mmat(SV,0.2,0.95));
  bar.rotation.set(0,0,Math.PI/2);
  bar.position.set(0, Math.sin(a)*0.41, Math.cos(a)*0.41);
  spinGroup.add(bar);
}

// Shaft
add('shaft', cyl(0.11,0.11,L+2.6,16), mmat(SV,0.18,0.96), 0,0,0, 0,0,Math.PI/2, spinGroup);

// End bells (left & right)
add('ebL',  cyl(1.06,1.06,0.3,32), mmat(BL,0.28,0.88),  -(L/2+0.22),0,0, 0,0,Math.PI/2);
add('ebLi', cyl(0.88,0.88,0.2,32), mmat(DK,0.6,0.5),    -(L/2+0.22),0,0, 0,0,Math.PI/2);
add('ebR',  cyl(1.06,1.06,0.3,32), mmat(BL,0.28,0.88),   (L/2+0.22),0,0, 0,0,Math.PI/2);
add('ebRi', cyl(0.88,0.88,0.2,32), mmat(DK,0.6,0.5),     (L/2+0.22),0,0, 0,0,Math.PI/2);

// Bearings
for (let s=0; s<2; s++) {
  const sx = (s===0 ? -1 : 1) * (L/2+0.22);
  const br = new THREE.Mesh(new THREE.TorusGeometry(0.22,0.055,8,24), mmat(SV,0.2,0.95));
  br.rotation.y = Math.PI/2; br.position.set(sx,0,0);
  pivot.add(br);
}

// Cooling fan
const fanX = L/2 + 0.6;
add('fanHub', cyl(0.17,0.17,0.2,16), mmat(DK,0.6,0.5), fanX,0,0, 0,0,Math.PI/2, spinGroup);
for (let i=0; i<5; i++) {
  const a = (i/5)*Math.PI*2;
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.4,0.2), mmat(LB,0.3,0.6));
  blade.position.set(fanX, Math.sin(a)*0.52, Math.cos(a)*0.52);
  blade.rotation.x = a + 0.3; blade.rotation.y = Math.PI/2;
  spinGroup.add(blade);
}

// Fan cover
add('fanCov',  cyl(0.95,0.95,0.6,32),  mmat(LB,0.3,0.72), L/2+0.78,0,0, 0,0,Math.PI/2);
add('fanCovF', cyl(0.95,0.95,0.06,32), mmat(LB,0.3,0.72), L/2+1.09,0,0, 0,0,Math.PI/2);

// Terminal box
add('tbBase', new THREE.BoxGeometry(0.72,0.58,0.58), mmat(LB,0.28,0.72),      0,1.46,0.56);
add('tbTop',  new THREE.BoxGeometry(0.62,0.36,0.52), mmat(0x1a2a4a,0.4,0.6),  0,1.83,0.56);
for (let i=-1; i<=1; i++) {
  const conn = new THREE.Mesh(new THREE.BoxGeometry(0.07,0.19,0.07), mmat(GD,0.4,0.6));
  conn.position.set(i*0.19, 1.97, 0.56);
  pivot.add(conn);
}

// Mounting feet
add('mntL', new THREE.BoxGeometry(0.26,0.34,0.52), mmat(BL,0.28,0.88), -1.0,-1.13,0);
add('mntR', new THREE.BoxGeometry(0.26,0.34,0.52), mmat(BL,0.28,0.88),  1.0,-1.13,0);

// X-Ray transparent shells
const xMat = new THREE.MeshStandardMaterial({
  color:0x3b82f6, roughness:0.3, metalness:0.4,
  transparent:true, opacity:0.18, side:THREE.DoubleSide
});
const xFrame = new THREE.Mesh(cyl(1.06,1.06,L,48), xMat);
xFrame.rotation.z=Math.PI/2; xFrame.visible=false; pivot.add(xFrame);
const xEbL = new THREE.Mesh(cyl(1.06,1.06,0.3,32), xMat);
xEbL.rotation.z=Math.PI/2; xEbL.position.x=-(L/2+0.22); xEbL.visible=false; pivot.add(xEbL);
const xEbR = new THREE.Mesh(cyl(1.06,1.06,0.3,32), xMat);
xEbR.rotation.z=Math.PI/2; xEbR.position.x=(L/2+0.22); xEbR.visible=false; pivot.add(xEbR);
const xFan = new THREE.Mesh(cyl(0.95,0.95,0.6,32), xMat);
xFan.rotation.z=Math.PI/2; xFan.position.x=L/2+0.78; xFan.visible=false; pivot.add(xFan);
const xRidges = [];
for (let i=0; i<10; i++) {
  const rx = -L/2 + 0.18 + i*(L-0.12)/9;
  const xr = new THREE.Mesh(cyl(1.12,1.12,0.07,48), xMat);
  xr.rotation.z=Math.PI/2; xr.position.x=rx; xr.visible=false; pivot.add(xr);
  xRidges.push(xr);
}

// Explode target positions
const EXPLODE = {
  frame:     [-3.8,0,0],
  statorLam: [-2.8,0,0],
  ebL:  [-5.5,0,0], ebLi: [-5.5,0,0],
  ebR:  [ 5.8,0,0], ebRi: [ 5.8,0,0],
  fanCov:  [7.0,0,0],
  fanCovF: [7.6,0,0],
  tbBase:  [0, 2.8, 0.56],
  tbTop:   [0, 3.5, 0.56],
  mntL: [-1.0,-2.4,0],
  mntR: [ 1.0,-2.4,0],
};
Object.entries(EXPLODE).forEach(([k,v]) => {
  if (parts[k]) parts[k].ex = new THREE.Vector3(...v);
});

let mode = 'explode';
let autoRot = true;
let spinAngle = 0;

const XRAY_HIDE = ['frame','ebL','ebLi','ebR','ebRi','fanCov','fanCovF'];
for (let i=0;i<10;i++) XRAY_HIDE.push('ridge'+i);

function setMode(m) {
  mode = m;
  ['explode','assemble','spin','xray'].forEach(x => {
    document.getElementById('b-'+x).classList.toggle('on', x===m);
  });
  const xr = (m === 'xray');
  xFrame.visible=xr; xEbL.visible=xr; xEbR.visible=xr; xFan.visible=xr;
  xRidges.forEach(r => r.visible=xr);
  XRAY_HIDE.forEach(k => { if (parts[k]) parts[k].mesh.visible = !xr; });
}

// Drag rotation
let isDragging=false, lastX=0, lastY=0;
let rotX=0.25, rotY=0, velX=0, velY=0;
let zoom=12;

function stopAuto() {
  autoRot=false;
  document.getElementById('b-auto').classList.remove('on');
}

cv.addEventListener('mousedown', e => { isDragging=true; lastX=e.clientX; lastY=e.clientY; stopAuto(); });
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  velY=(e.clientX-lastX)*0.012; velX=(e.clientY-lastY)*0.012;
  rotY+=velY; rotX=Math.max(-1.2,Math.min(1.2,rotX+velX));
  lastX=e.clientX; lastY=e.clientY;
});
window.addEventListener('mouseup', () => isDragging=false);

cv.addEventListener('touchstart', e => { isDragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; stopAuto(); },{passive:true});
window.addEventListener('touchmove', e => {
  if (!isDragging) return;
  velY=(e.touches[0].clientX-lastX)*0.012; velX=(e.touches[0].clientY-lastY)*0.012;
  rotY+=velY; rotX=Math.max(-1.2,Math.min(1.2,rotX+velX));
  lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
},{passive:true});
window.addEventListener('touchend', () => isDragging=false);

cv.addEventListener('wheel', e => {
  zoom=Math.max(5,Math.min(20,zoom+e.deltaY*0.015));
  e.preventDefault();
},{passive:false});

window.addEventListener('resize', resize);

function lerp(a,b,t){ return a+(b-a)*t; }

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!isDragging) {
    velX*=0.88; velY*=0.88;
    rotX=Math.max(-1.2,Math.min(1.2,rotX+velX));
    rotY+=velY;
    if (autoRot) rotY+=dt*0.35;
  }

  pivot.rotation.x = rotX;
  pivot.rotation.y = rotY;
  camera.position.set(0,0,zoom);
  camera.lookAt(0,0,0);

  const spd = 0.055;
  const isEx = (mode==='explode');
  Object.keys(parts).forEach(k => {
    const p = parts[k];
    const tgt = isEx ? p.ex : p.home;
    p.mesh.position.x = lerp(p.mesh.position.x, tgt.x, spd);
    p.mesh.position.y = lerp(p.mesh.position.y, tgt.y, spd);
    p.mesh.position.z = lerp(p.mesh.position.z, tgt.z, spd);
  });

  if (mode==='spin') {
    spinAngle+=dt*5;
    spinGroup.rotation.x=spinAngle;
    rl.intensity=2+Math.sin(spinAngle*3)*1;
    bl.intensity=3+Math.sin(spinAngle*2)*1.2;
  } else {
    spinGroup.rotation.x=lerp(spinGroup.rotation.x,0,0.05);
    rl.intensity=lerp(rl.intensity,0,0.05);
    bl.intensity=lerp(bl.intensity,4,0.05);
  }

  renderer.render(scene,camera);
}

resize();
animate();
</script>
</body>
</html>
