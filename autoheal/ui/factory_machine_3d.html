<style>
  body { margin: 0; overflow: hidden; background: transparent; }
  canvas { display: block; }
  #ui {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(0,0,0,0.5);
    border-radius: 24px;
    padding: 8px 20px;
    color: #fff;
    font-family: sans-serif;
    font-size: 13px;
    user-select: none;
  }
  #ui button {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    border-radius: 12px;
    padding: 5px 14px;
    cursor: pointer;
    font-size: 12px;
  }
  #ui button:hover { background: rgba(255,255,255,0.28); }
  #status { min-width: 110px; text-align: center; opacity: 0.85; }
</style>
<canvas id="c"></canvas>
<div id="ui">
  <button onclick="restartAnim()">↺ Replay</button>
  <span id="status">Working...</span>
  <button onclick="togglePause()">⏸ Pause</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x1a1a2e, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a1a2e, 20, 60);

const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 100);
camera.position.set(10, 8, 14);
camera.lookAt(0, 1, 0);

// Lights
const ambient = new THREE.AmbientLight(0x334466, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
dirLight.position.set(8, 12, 6);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);
const pointRed = new THREE.PointLight(0xff4400, 0, 8);
pointRed.position.set(0, 3, 0);
scene.add(pointRed);
const pointBlue = new THREE.PointLight(0x2244ff, 1.5, 12);
pointBlue.position.set(-4, 4, 3);
scene.add(pointBlue);

// Floor
const floorGeo = new THREE.PlaneGeometry(30, 20);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.9, metalness: 0.1 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// Grid lines on floor
const gridHelper = new THREE.GridHelper(30, 20, 0x334455, 0x2a3344);
scene.add(gridHelper);

// ---- Machine Parts ----
const metalMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 0.4, metalness: 0.7 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x2d3748, roughness: 0.6, metalness: 0.5 });
const yellowMat = new THREE.MeshStandardMaterial({ color: 0xf6ad55, roughness: 0.5, metalness: 0.3 });
const redMat = new THREE.MeshStandardMaterial({ color: 0xfc4444, roughness: 0.4, metalness: 0.3 });
const greenMat = new THREE.MeshStandardMaterial({ color: 0x48bb78, roughness: 0.5, metalness: 0.2 });

function box(w,h,d,mat,x,y,z,rx=0,ry=0,rz=0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}
function cyl(r,h,mat,x,y,z,rx=0,ry=0) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16), mat);
  m.position.set(x,y,z); m.rotation.set(rx,0,ry);
  m.castShadow = true; scene.add(m); return m;
}

// Machine base
const base = box(6,0.4,3.5, metalMat, 0,0.2,0);
const body = box(5,3,3, darkMat, 0,1.9,0);
const topPanel = box(5.2,0.2,3.2, metalMat, 0,3.5,0);

// Control panel on front
const panel = box(2,1.5,0.15, new THREE.MeshStandardMaterial({color:0x2b3a5c, roughness:0.3, metalness:0.6}), -0.5,2.2,1.58);
// Buttons
const btn1 = box(0.25,0.25,0.05, greenMat, -1.2,2.5,1.66);
const btn2 = box(0.25,0.25,0.05, yellowMat, -0.8,2.5,1.66);
const btn3 = box(0.25,0.25,0.05, redMat, -0.4,2.5,1.66);
// Screen
const screen = new THREE.Mesh(
  new THREE.BoxGeometry(1.2,0.8,0.05),
  new THREE.MeshStandardMaterial({color:0x00aaff, emissive:0x004488, emissiveIntensity:0.8, roughness:0.2})
);
screen.position.set(-0.5,2.0,1.66); scene.add(screen);

// Chimney/exhaust pipe
const exhaust1 = cyl(0.15,2, metalMat, 2,4.5,0.8);
const exhaust2 = cyl(0.2,0.2, metalMat, 2,5.6,0.8);

// Pistons (left side)
const pistonBase1 = box(0.4,1.5,0.4, metalMat, -2.7,1.8,0.4);
const pistonRod1 = box(0.2,0.8,0.2, new THREE.MeshStandardMaterial({color:0x9aa5b4,metalness:0.9,roughness:0.2}), -2.7,2.8,0.4);
const pistonBase2 = box(0.4,1.5,0.4, metalMat, -2.7,1.8,-0.4);
const pistonRod2 = box(0.2,0.8,0.2, new THREE.MeshStandardMaterial({color:0x9aa5b4,metalness:0.9,roughness:0.2}), -2.7,2.8,-0.4);

// Gears (right side) — using cylinders with flat faces
const gearMat = new THREE.MeshStandardMaterial({color:0x718096, roughness:0.3, metalness:0.8});
const gear1 = cyl(0.7,0.2, gearMat, 2.9,2.5,0.6);
const gear2 = cyl(0.45,0.2, gearMat, 2.9,1.6,0.6);
// Gear teeth via small boxes
const teeth1 = [], teeth2 = [];
for(let i=0;i<8;i++){
  const a = (i/8)*Math.PI*2;
  const t = box(0.15,0.15,0.22, gearMat, 2.9+Math.cos(a)*0.72,2.5+Math.sin(a)*0.72,0.6);
  teeth1.push({mesh:t, angle:a, cx:2.9, cy:2.5, cz:0.6});
}
for(let i=0;i<6;i++){
  const a = (i/6)*Math.PI*2;
  const t = box(0.12,0.12,0.22, gearMat, 2.9+Math.cos(a)*0.47,1.6+Math.sin(a)*0.47,0.6);
  teeth2.push({mesh:t, angle:a, cx:2.9, cy:1.6, cz:0.6});
}

// Conveyor belt
const convBase = box(10,0.2,1.2, metalMat, 0,0.5,0);
const convBeltMat = new THREE.MeshStandardMaterial({color:0x2d3748, roughness:0.8, metalness:0.1});
const convBelt = box(9.8,0.1,1.0, convBeltMat, 0,0.62,0);
// Conveyor rollers
for(let i=-4.5;i<=4.5;i+=1.5) cyl(0.12,1.1, new THREE.MeshStandardMaterial({color:0x5a6675,metalness:0.7,roughness:0.3}), i,0.62,0,Math.PI/2);
// Items on conveyor
const item1 = box(0.5,0.5,0.5, yellowMat, -3,0.97,0);
const item2 = box(0.5,0.5,0.5, new THREE.MeshStandardMaterial({color:0x63b3ed,roughness:0.4}), 0,0.97,0);
const item3 = box(0.5,0.5,0.5, new THREE.MeshStandardMaterial({color:0xf687b3,roughness:0.4}), 3,0.97,0);

// Smoke particles
const particles = [];
function makeSmoke() {
  const geo = new THREE.SphereGeometry(0.08,6,6);
  const mat = new THREE.MeshBasicMaterial({color:0x888888, transparent:true, opacity:0.5});
  const p = new THREE.Mesh(geo, mat);
  p.position.set(2+(Math.random()-0.5)*0.3, 5.7, 0.8+(Math.random()-0.5)*0.2);
  p.userData = {vy: 0.02+Math.random()*0.01, vx:(Math.random()-0.5)*0.005, life:1};
  scene.add(p); return p;
}

// Damage sparks
const sparks = [];
function makeSpark(x,y,z) {
  const geo = new THREE.SphereGeometry(0.04,4,4);
  const mat = new THREE.MeshBasicMaterial({color:0xffaa00, transparent:true, opacity:1});
  const p = new THREE.Mesh(geo, mat);
  p.position.set(x,y,z);
  const a = Math.random()*Math.PI*2;
  const spd = 0.05+Math.random()*0.08;
  p.userData = {vx:Math.cos(a)*spd, vy:0.05+Math.random()*0.06, vz:Math.sin(a)*spd, life:1};
  scene.add(p); return p;
}

// Debris chunks
const debrisChunks = [];
function makeDebris(x,y,z) {
  const s = 0.1+Math.random()*0.25;
  const geo = new THREE.BoxGeometry(s,s,s);
  const mat = new THREE.MeshStandardMaterial({color:0x4a5568, roughness:0.8});
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z);
  const a = Math.random()*Math.PI*2;
  const spd = 0.04+Math.random()*0.06;
  m.userData = {vx:Math.cos(a)*spd, vy:0.08+Math.random()*0.07, vz:Math.sin(a)*spd, ry:Math.random()*0.1-0.05, life:1, grav:0};
  scene.add(m); return m;
}

// --- Animation state ---
let clock = new THREE.Clock();
let totalTime = 0;
let phase = 'working'; // 'working' | 'damage' | 'done'
let paused = false;
let gearAngle1 = 0, gearAngle2 = 0;
let smokeTimer = 0;
let sparkTimer = 0;
let damageStarted = false;
const DAMAGE_START = 3.5;
const ANIM_DURATION = 6.5;

// Shake state
let shakeAmt = 0;
let originalBodyPos = body.position.clone();

// Store original item positions
const itemOrigX = [item1.position.x, item2.position.x, item3.position.x];
const items = [item1, item2, item3];

// Fire light
const fireLight = new THREE.PointLight(0xff6600, 0, 5);
fireLight.position.set(0, 3, 1.5);
scene.add(fireLight);

// Broken/fire overlay mesh
const fireMat = new THREE.MeshBasicMaterial({color:0xff4400, transparent:true, opacity:0, depthWrite:false});
const fireMesh = new THREE.Mesh(new THREE.PlaneGeometry(5,3), fireMat);
fireMesh.position.set(0,2,1.7);
scene.add(fireMesh);

// Crack overlay (emissive red glow on body)
const crackMat = new THREE.MeshStandardMaterial({color:0xff2200, emissive:0xff2200, emissiveIntensity:0, transparent:true, opacity:0});
const crackMesh = new THREE.Mesh(new THREE.BoxGeometry(5.02,3.02,3.02), crackMat);
crackMesh.position.copy(body.position);
scene.add(crackMesh);

function restartAnim() {
  totalTime = 0; phase = 'working'; damageStarted = false;
  clock = new THREE.Clock();
  // Reset positions
  body.position.copy(originalBodyPos);
  body.rotation.set(0,0,0);
  topPanel.position.y = 3.5; topPanel.rotation.set(0,0,0);
  pistonRod1.position.y = 2.8; pistonRod2.position.y = 2.8;
  fireMat.opacity = 0; crackMat.opacity = 0; crackMat.emissiveIntensity = 0;
  fireLight.intensity = 0; pointRed.intensity = 0;
  items.forEach((it,i) => { it.position.x = itemOrigX[i]; it.position.y = 0.97; it.rotation.set(0,0,0); });
  // Remove old debris/sparks
  [...sparks, ...debrisChunks, ...particles].forEach(p => scene.remove(p.mesh||p));
  sparks.length = 0; debrisChunks.length = 0; particles.length = 0;
  exhaust1.position.set(2,4.5,0.8); exhaust2.position.set(2,5.6,0.8);
  document.getElementById('status').textContent = 'Working...';
  paused = false;
  document.querySelector('#ui button:last-child').textContent = '⏸ Pause';
}

function togglePause() {
  paused = !paused;
  if(!paused) clock = new THREE.Clock(true);
  document.querySelector('#ui button:last-child').textContent = paused ? '▶ Resume' : '⏸ Pause';
}

function animate() {
  requestAnimationFrame(animate);
  if(paused) { renderer.render(scene,camera); return; }

  const dt = Math.min(clock.getDelta(), 0.05);
  totalTime += dt;

  const t = totalTime;
  const isWorking = t < DAMAGE_START;
  const isDamage = t >= DAMAGE_START && t < ANIM_DURATION;
  const isDone = t >= ANIM_DURATION;

  if(isDone && phase !== 'done') { phase='done'; document.getElementById('status').textContent='Damaged!'; }
  else if(isDamage && phase === 'working') { phase='damage'; document.getElementById('status').textContent='DAMAGE!'; }

  // --- WORKING PHASE ---
  if(isWorking || isDamage) {
    // Gears rotate
    const gearSpeed = isWorking ? 1.5 : Math.max(0, 1.5 - (t-DAMAGE_START)*1.2);
    gearAngle1 += dt * gearSpeed;
    gearAngle2 -= dt * gearSpeed * 1.5;
    gear1.rotation.z = gearAngle1;
    gear2.rotation.z = gearAngle2;
    teeth1.forEach(({mesh,angle,cx,cy,cz}) => {
      const a2 = angle + gearAngle1;
      mesh.position.x = cx + Math.cos(a2)*0.72;
      mesh.position.y = cy + Math.sin(a2)*0.72;
      mesh.rotation.z = a2;
    });
    teeth2.forEach(({mesh,angle,cx,cy,cz}) => {
      const a2 = angle + gearAngle2;
      mesh.position.x = cx + Math.cos(a2)*0.47;
      mesh.position.y = cy + Math.sin(a2)*0.47;
      mesh.rotation.z = a2;
    });

    // Pistons
    const ps = isWorking ? 1 : Math.max(0,1-(t-DAMAGE_START)*1.5);
    pistonRod1.position.y = 2.8 + Math.sin(t*3)*0.3*ps;
    pistonRod2.position.y = 2.8 + Math.sin(t*3+Math.PI)*0.3*ps;

    // Conveyor belt items move
    const beltSpeed = isWorking ? 0.8 : Math.max(0,0.8-(t-DAMAGE_START)*0.8);
    items.forEach((it,i) => {
      if(it.position.y > 0.5) {
        it.position.x -= dt * beltSpeed;
        if(it.position.x < -6) it.position.x = 5;
      }
    });

    // Normal smoke
    if(isWorking) {
      smokeTimer += dt;
      if(smokeTimer > 0.18) { smokeTimer=0; particles.push(makeSmoke()); }
    }
  }

  // --- DAMAGE PHASE ---
  if(isDamage) {
    const dp = (t - DAMAGE_START) / (ANIM_DURATION - DAMAGE_START); // 0..1
    const shake = Math.sin(t*30)*0.06*(1-dp*0.5);
    shakeAmt = shake;
    body.position.x = originalBodyPos.x + shake;
    body.position.z = originalBodyPos.z + shake*0.5;

    // Red glow / cracks appear
    crackMat.opacity = Math.min(0.3, dp*0.5);
    crackMat.emissiveIntensity = Math.min(2, dp*3);
    crackMesh.position.copy(body.position);

    // Fire overlay
    fireMat.opacity = Math.min(0.4, dp*0.7);
    fireLight.intensity = dp*8;
    pointRed.intensity = dp*6;

    // Top blows off
    if(dp > 0.35) {
      const bp = (dp-0.35)/0.65;
      topPanel.position.y = 3.5 + bp*2;
      topPanel.rotation.x = bp*0.8;
      topPanel.rotation.z = bp*0.5;
    }

    // Exhaust pipe tilts
    if(dp > 0.4) {
      exhaust1.rotation.z = (dp-0.4)*1.2;
      exhaust1.position.x = 2 + (dp-0.4)*0.5;
    }

    // Sparks burst
    sparkTimer += dt;
    const sparkRate = 0.04 + dp*0.02;
    if(sparkTimer > sparkRate) {
      sparkTimer = 0;
      for(let i=0;i<3;i++) sparks.push(makeSpark((Math.random()-0.5)*4, 1.5+Math.random()*2, (Math.random()-0.5)*2));
    }

    // Debris falls out
    if(dp > 0.2 && Math.random() < dp*0.15) {
      debrisChunks.push(makeDebris((Math.random()-0.5)*4, 2+Math.random()*2, (Math.random()-0.5)*2));
    }

    // Screen flickers
    screen.material.emissiveIntensity = dp > 0.5 ? (Math.random() > 0.5 ? 0 : 0.8) : 0.8;

    // Items fall off conveyor
    if(dp > 0.5) {
      items.forEach((it,i) => {
        if(it.position.y > 0.3) {
          it.position.y -= dt*1.5;
          it.rotation.x += dt*2;
          it.rotation.z += dt*1.5;
        }
      });
    }

    // Heavy smoke
    smokeTimer += dt;
    if(smokeTimer > 0.07) {
      smokeTimer=0;
      for(let i=0;i<3;i++) {
        const p = makeSmoke();
        p.material = new THREE.MeshBasicMaterial({color:0x333333, transparent:true, opacity:0.7});
        p.position.set((Math.random()-0.5)*4, 2+Math.random()*2, (Math.random()-0.5)*2);
        p.userData.vy = 0.03+Math.random()*0.02;
        particles.push(p);
      }
    }
  }

  // Update smoke
  for(let i=particles.length-1;i>=0;i--) {
    const p = particles[i];
    p.position.x += p.userData.vx||0;
    p.position.y += p.userData.vy;
    p.userData.life -= dt*0.4;
    p.material.opacity = p.userData.life*0.5;
    p.scale.setScalar(1 + (1-p.userData.life)*1.5);
    if(p.userData.life<=0) { scene.remove(p); particles.splice(i,1); }
  }

  // Update sparks
  for(let i=sparks.length-1;i>=0;i--) {
    const p = sparks[i];
    p.position.x += p.userData.vx;
    p.position.y += p.userData.vy;
    p.position.z += p.userData.vz;
    p.userData.vy -= 0.004;
    p.userData.life -= dt*2.5;
    p.material.opacity = p.userData.life;
    if(p.userData.life<=0) { scene.remove(p); sparks.splice(i,1); }
  }

  // Update debris
  for(let i=debrisChunks.length-1;i>=0;i--) {
    const p = debrisChunks[i];
    p.position.x += p.userData.vx;
    p.position.y += p.userData.vy;
    p.position.z += p.userData.vz;
    p.userData.vy -= 0.006;
    p.rotation.y += p.userData.ry;
    p.rotation.x += p.userData.ry*0.7;
    p.userData.life -= dt*0.3;
    if(p.position.y < 0) { p.position.y = 0; p.userData.vy *= -0.3; p.userData.vx *= 0.7; p.userData.vz *= 0.7; }
    if(p.userData.life<=0) { scene.remove(p); debrisChunks.splice(i,1); }
  }

  // Camera slight orbit
  const camA = Math.sin(t*0.15)*0.2;
  camera.position.x = 10*Math.cos(camA) + 2;
  camera.position.z = 10*Math.sin(camA+0.5) + 4;
  camera.lookAt(0, 2, 0);

  renderer.render(scene, camera);
}

animate();
</script>
