[client]
showSidebarNavigation = false

[theme]
primaryColor = "#0071E3"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"
textColor = "#1D1D1F"
font = "sans serif"
base = "light"

[server]
headless = true
runOnSave = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 15

[browser]
gatherUsageStats = false
